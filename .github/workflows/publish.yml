name: Build and Publish

on:
  push:
    branches:
      - main  # Adjust if your primary branch is different
    paths-ignore:
      - 'package.json' # To avoid triggering the workflow for version bump commits

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    # OIDC trusted publishing: GitHub mints a short-lived id-token, npm
    # exchanges it for a one-shot publish credential. Replaces NPM_TOKEN.
    # Requires a "Trusted Publisher" entry on each npm package pointing
    # at this repo + workflow filename.
    permissions:
      id-token: write
      contents: write  # needed by `git push origin main` at the end

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      # v4 stopped writing the deprecated `always-auth=false` line into
      # .npmrc, which removes the "Unknown user config" warning npm 11+ emits.
      uses: actions/setup-node@v4
      with:
        # Node 24+ ships with npm 11 which supports OIDC. Node 16's npm 8 does NOT.
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    # Defensive: ensure the npm CLI is recent enough for trusted publishing,
    # even if the bundled npm regresses.
    - name: Ensure npm >= 11.5.1
      run: npm install -g npm@latest

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Git config
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email "${{ secrets.GH_ORG_EMAIL }}"
        git config --global user.name "${{ secrets.GH_ORG_NAME }}"

    - name: Bump version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm version patch

    - name: Publish to NPM (globalseo)
      run: npm publish

    - name: Rename package name to weploy-translate
      run: |
        sed -i 's/"name": "globalseo"/"name": "weploy-translate"/' package.json

    - name: Re-publish to NPM (weploy-translate)
      run: npm publish

    - name: Push bumped version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: git push origin main
